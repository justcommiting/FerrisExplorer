[package]
name = "ferris-explorer"
version = "0.3.2"
edition = "2021"
description = "A fast, keyboard-first file explorer with a live search index"
license = "MIT"
authors = ["dragonfly"]
readme = "../README.md"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
log = "0.4"
tokio = { version = "1.38", features = ["rt-multi-thread", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.42", features = ["bundled", "modern_sqlite"] }
thiserror = "1.0"
async-trait = "0.1"
notify = "6.1"
base64 = "0.22"
fs4 = { version = "1.1.0", features = ["sync"] }
trash = "5"
drag = "2.1.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.11"
lzma-rust2 = "0.25.0"
bzip2 = "0.5.2"
sha2 = "0.10"
lopdf = { version = "0.47", default-features = false }
quick-xml = "0.42"
toml = "0.8"

# Atomic no-replace rename (see desktop::rename_noreplace). Versions match the
# lockfile, which already resolves them through Tauri.
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
